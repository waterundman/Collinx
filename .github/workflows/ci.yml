name: CI

# v2.9.1 修正：
# 1. 触发分支此前是 [main, develop] —— 仓库默认分支是 **master**，
#    所以这份 CI 从来没有在推送时跑过（技术债审计发现）。
# 2. 删掉 performance / stability / coverage 三个 job：
#    - 前两个是 `pnpm test | grep -E "(performance|stability)"`，仓库里没有任何
#      这样命名的测试 → grep 退出码 1 → job 必红；
#    - coverage 依赖未安装的覆盖率插件（`@vitest/coverage-v8`）。
#    留着它们只会制造「CI 是红的，所以不看 CI」的习惯，比没有 CI 更糟。
# 3. e2e 在独立 workflow（ci-e2e.yml）：需要浏览器下载 + dev server，
#    与单测分开放，失败时不影响单测信号。
on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x 不支持 `node --test --experimental-strip-types`（desktop 包的测试入口），
        # 且 packages/ui 的 Vite 5 在 18 上已非首选。最低支持线提到 20。
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build
