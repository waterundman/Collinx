name: CI (Audio Engine)

# packages/audio 是一个基于 JUCE 的 C++ 音频引擎（DSP / VST3 / CLAP / MIDI /
# presets / sandbox / perf，约 18k 行）。它从 initial commit 起就在仓库里，但此前的
# CI 从未构建过它 —— 因此这段代码既没有被验证过，也无法安全地迭代优化。
#
# 本 workflow 的职责：给它一条能构建、能跑测试的基线。首次运行大概率会暴露
# 真实问题（依赖缺失、平台差异、测试与实现漂移），这正是它的价值：
# 把"看不见的风险"变成"CI 里可见的红灯"。

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/audio/**'
      - '.github/workflows/ci-audio.yml'
  pull_request:
    paths:
      - 'packages/audio/**'
      - '.github/workflows/ci-audio.yml'
  workflow_dispatch:

concurrency:
  group: ci-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # JUCE 8.0.1 由 CMake 的 FetchContent 拉取并全量编译，约 10–20 分钟。
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # v2.8.0：juce_gui_extra 的 WebBrowserComponent 需要 gtk/gtk.h。
      # 此前只装了 libwebkit2gtk-4.1-dev，它不带 GTK 开发头文件，导致编译到
      # juce_gui_extra.cpp 时报 "gtk/gtk.h: No such file or directory"。
      # 注意：注释必须放在 run 之外 —— 在 bash 的 \ 续行中间插 # 会破坏命令。
      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: packages/audio/build/_deps
          key: juce-8.0.1-${{ runner.os }}

      - name: Configure
        working-directory: packages/audio
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: packages/audio
        # 首轮可能因机器资源紧张失败，降到 2 并行并在日志里保留完整报错
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: packages/audio
        # JUCE 的 GUI/host 模块在无显示环境下需要虚拟显示。
        # -V：把测试的 stdout 也打进 CI 日志 —— 否则 ctest 只在失败时显示输出，
        # 成功时看不到 "Results: N passed, M failed"，无法确认用例真的被执行
        # （v2.8.0 审查时正是靠这一点发现 scan_tests 的 assert 在 Release 下失效）。
        run: xvfb-run -a ctest --test-dir build -V

      - name: Upload CTest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: packages/audio/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ── Node addon（@collinx/audio-native）──────────────────────────────
  # 独立 job：addon 是新的、未验证的代码，失败不应连累主引擎的测试结果。
  # 它编译 SynthBridge（v2.8.0 新增的合成器桥）+ 既有 VST3 宿主桥。
  build-napi:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # 依赖与主 job 对齐：juceaide（JUCE 的构建期工具）会独立编译，
      # 它需要 fontconfig / freetype，缺了会在 Configure 阶段报
      # ninja: error: '/usr/lib/x86_64-linux-gnu/libfontconfig.so'。
      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev

      - name: Install node-addon-api
        working-directory: packages/audio
        run: npm i --no-save --no-package-lock node-addon-api

      - name: Cache JUCE checkout
        uses: actions/cache@v4
        with:
          path: packages/audio/build/_deps
          key: juce-8.0.1-${{ runner.os }}

      - name: Configure with BUILD_NAPI
        working-directory: packages/audio
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_NAPI=ON

      - name: Build addon target
        working-directory: packages/audio
        run: cmake --build build --parallel 2 --target collinx-audio-native

      - name: Verify .node artifact exists
        working-directory: packages/audio
        run: |
          ls -la build/*.node
          node -e "
            const path = require('path');
            const m = require(path.resolve('build/collinx-audio-native.node'));
            console.log('exports:', Object.keys(m).join(', '));
            const s = new m.SynthBridge();
            s.prepare(44100, 512);
            s.noteOn(60, 0.8);
            const block = s.render(512);
            const nz = block.reduce((a, v) => a + Math.abs(v), 0);
            console.log('block length:', block.length, 'energy:', nz.toFixed(4));
            if (!(block instanceof Float32Array)) throw new Error('render() 未返回 Float32Array');
            if (nz <= 0) throw new Error('渲染结果全静音 —— 合成器没有真正发声');
            console.log('OK: SynthBridge 能渲染出非静音音频');
            // VST3 宿主桥（v2.8.0 同批修好的 1628 行代码）：只验证可实例化与
            // 路径推导，不做真实磁盘扫描（CI 里没有插件，且扫描会拖慢）
            const pm = new m.PluginManagerBridge();
            if (!pm) throw new Error('PluginManagerBridge 实例化失败');
            const paths = m.getDefaultScanPaths();
            console.log('PluginManagerBridge OK, VST3 scan paths:', paths.length);
            if (!Array.isArray(paths)) throw new Error('getDefaultScanPaths 未返回数组');

          "
